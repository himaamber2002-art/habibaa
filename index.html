<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لكِ وحدك</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #16100c;
    --panel: #221810;
    --panel-2: #2b1e15;
    --cream: #f3e7d8;
    --cream-dim: #cdbba6;
    --rose: #cf9a8c;
    --gold: #c79a5a;
    --line: #4a382a;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:var(--bg);}
  body{
    font-family:'Tajawal',sans-serif;
    color:var(--cream);
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  .page{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    position:relative;
    background:
      radial-gradient(120% 60% at 50% 0%, rgba(207,154,140,0.10), transparent 60%),
      var(--bg);
  }

  /* floating embers - single orchestrated ambient layer */
  .ember{
    position:fixed;
    border-radius:50%;
    background:var(--gold);
    opacity:0.35;
    filter:blur(1px);
    animation:drift 14s linear infinite;
    pointer-events:none;
  }
  @keyframes drift{
    0%{ transform:translateY(110vh) translateX(0); opacity:0; }
    10%{ opacity:0.35; }
    90%{ opacity:0.25; }
    100%{ transform:translateY(-10vh) translateX(20px); opacity:0; }
  }

  /* HERO */
  .hero{
    position:relative;
    height:92vh;
    min-height:560px;
    display:flex;
    align-items:flex-end;
    overflow:hidden;
  }
  .hero img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    filter:saturate(0.92) contrast(1.02);
    opacity:0;
    transform:scale(1.06);
    animation:heroIn 1.8s ease forwards;
  }
  @keyframes heroIn{
    to{opacity:1; transform:scale(1);}
  }
  .hero::after{
    content:"";
    position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(22,16,12,0.05) 0%, rgba(22,16,12,0.15) 45%, rgba(22,16,12,0.97) 96%);
  }
  .hero-text{
    position:relative;
    z-index:2;
    padding:0 34px 46px;
    opacity:0;
    animation:riseIn 1.4s ease 0.5s forwards;
  }
  @keyframes riseIn{
    from{opacity:0; transform:translateY(16px);}
    to{opacity:1; transform:translateY(0);}
  }
  .eyebrow-line{
    width:34px;height:2px;background:var(--gold);
    margin-bottom:18px;
  }
  .hero-title{
    font-family:'Aref Ruqaa', serif;
    font-size:44px;
    line-height:1.35;
    color:var(--cream);
    font-weight:700;
  }
  .hero-sub{
    margin-top:14px;
    font-size:15px;
    color:var(--cream-dim);
    font-weight:300;
    letter-spacing:0.2px;
  }

  /* SECTIONS */
  section{
    padding:64px 30px;
    position:relative;
  }
  .divider{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:38px;
  }
  .divider span{
    font-family:'Aref Ruqaa', serif;
    font-size:22px;
    color:var(--rose);
  }
  .divider .rule{
    flex:1;
    height:1px;
    background:linear-gradient(90deg, var(--line), transparent);
  }

  .letter{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:2px;
    padding:38px 26px;
    position:relative;
  }
  .letter::before{
    content:"”";
    position:absolute;
    top:-6px; right:22px;
    font-family:'Aref Ruqaa', serif;
    font-size:70px;
    color:var(--gold);
    opacity:0.5;
  }
  .letter p{
    font-size:18px;
    line-height:2.15;
    color:var(--cream);
    font-weight:300;
  }
  .letter p + p{ margin-top:22px; }
  .letter .accent{
    color:var(--rose);
    font-weight:500;
  }
  .signoff{
    margin-top:30px;
    font-family:'Aref Ruqaa', serif;
    font-size:26px;
    color:var(--gold);
    text-align:left;
  }

  /* GALLERY */
  .gallery{
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  .gallery figure{
    border-radius:2px;
    overflow:hidden;
    border:1px solid var(--line);
  }
  .gallery img{
    width:100%;
    display:block;
    object-fit:cover;
  }
  .gallery .tall img{ height:520px; }
  .gallery .wide{ display:flex; gap:16px; }
  .gallery .wide figure{ flex:1; }
  .gallery .wide img{ height:230px; }
    figcaption{
    padding:16px 18px;
    font-family:'Aref Ruqaa', serif;
    font-size:17px;
    color:var(--gold);
    background:var(--panel-2);
    font-weight:700;
    text-align:center;
    letter-spacing:0.3px;
    border-top:1px solid var(--line);
  }

  /* SONG NOTE */
  .song{
    display:flex;
    align-items:center;
    gap:16px;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:2px;
    padding:20px 22px;
  }
  .song-icon{
    width:44px;height:44px;
    flex:0 0 44px;
    border-radius:50%;
    border:1px solid var(--gold);
    display:flex;align-items:center;justify-content:center;
    font-size:18px;
    color:var(--gold);
  }
  .song-text .t1{ font-size:15px; color:var(--cream-dim); margin-bottom:4px;}
  .song-text .t2{ font-family:'Aref Ruqaa', serif; font-size:19px; color:var(--cream); }

  /* CLOSING */
  .closing{
    text-align:center;
    padding:70px 30px 90px;
  }
  .closing .heart{
    font-size:26px;
    color:var(--rose);
    margin-bottom:20px;
  }
  .closing .line1{
    font-family:'Aref Ruqaa', serif;
    font-size:30px;
    color:var(--cream);
    margin-bottom:10px;
  }
  .closing .line2{
    font-size:14px;
    color:var(--cream-dim);
    letter-spacing:0.5px;
  }
</style>
</head>

</audio>
<script>
  const audio = document.getElementById('mySong');
  let hasPlayed = false;

  function startMusic() {
    if (hasPlayed) return;
    audio.play().then(() => {
      hasPlayed = true;
    }).catch(() => {});
  }

  startMusic();

  const events = ['touchstart', 'touchend', 'click', 'pointerdown', 'scroll'];
  events.forEach(event => {
    window.addEventListener(event, startMusic, { once: true, passive: true });
    document.addEventListener(event, startMusic, { once: true, passive: true });
  });
</script>
